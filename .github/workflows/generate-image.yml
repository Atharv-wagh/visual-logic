name: Generate Mermaid PNGs
on:
  push:
    paths:
      - '**.mmd' 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Convert to PNG
        # Finds any .mmd file and generates a transparent .png
        run: |
          for file in $(find . -name "*.mmd"); do
            mmdc -i "$file" -o "${file%.mmd}.png" -b transparent
          done

      - name: Commit and Push PNG
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.png
          git commit -m "Auto-generate PNGs from Mermaid" || echo "No changes to commit"
          git push
